  <!-- Notes -->
  <text class="h2" x="20" y="892">Catatan</text>
  <text class="note" x="20" y="916">1  Tab sub halaman aktif (Ctrl+2). Tanggal terpilih tercermin di URL /todo/history/:date.</text>
  <text class="note" x="20" y="936">2  Kalender: nama hari/bulan bahasa Inggris (en-US), minggu mulai Senin, titik = ada item dicentang atau waktu tercatat, tanggal masa depan nonaktif.</text>
  <text class="note" x="20" y="956">3  Navigasi cepat; “Next day” nonaktif saat hari ini. Keyboard ← / →.     4  Rekap 7 hari: batang = total waktu tercatat; klik batang = pilih tanggal.</text>
  <text class="note" x="20" y="976">5  Judul tanggal lengkap + label “Today” / “Yesterday”.     6  Ringkasan: item diselesaikan + total waktu tercatat.     7  Grup penuh: list utama selesai beserta sub list.</text>
  <text class="note" x="20" y="996">8  Grup sebagian: garis putus-putus + “Partial · 2 of 4”.     9  Catatan waktu: durasi, keterangan/list, jam dicatat. Semua konten dari snapshot (tetap utuh walau list diedit/dihapus).</text>
